# Baker's Crumbs additions to LibreChat's docker-compose.yml.
# Copied into /opt/librechat by scripts/start-bakers-crumbs.sh.
services:
  api:
    # Application log -> CloudWatch Logs (credentials come from the EC2 instance role)
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-create-group: "true"
        awslogs-group: /bakers-crumbs/librechat
    environment:
      # Injected from SSM Parameter Store by start-bakers-crumbs.sh at start-up; never stored in a file.
      - GOOGLE_KEY=${GOOGLE_KEY:-}
    volumes:
      - type: bind
        source: ./librechat.yaml
        target: /app/librechat.yaml
      # Branding: replace LibreChat's logo and browser icons
      - ./branding/logo.svg:/app/client/dist/assets/logo.svg:ro
      - ./branding/logo-32.png:/app/client/dist/assets/favicon-32x32.png:ro
      - ./branding/logo-16.png:/app/client/dist/assets/favicon-16x16.png:ro
      - ./branding/logo-180.png:/app/client/dist/assets/apple-touch-icon-180x180.png:ro
      - ./branding/logo-192.png:/app/client/dist/assets/icon-192x192.png:ro
      - ./branding/maskable-512.png:/app/client/dist/assets/maskable-icon.png:ro

  # Database log -> CloudWatch Logs
  mongodb:
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-create-group: "true"
        awslogs-group: /bakers-crumbs/mongodb

  # HTTPS front door. Ports 80 (redirect + certificate check) and 443 are the only ones open in the security group.
  caddy:
    image: caddy:2
    container_name: bakers-crumbs-https
    restart: always
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    # Access log (one JSON line per HTTP request: status, duration) -> CloudWatch Logs
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-create-group: "true"
        awslogs-group: /bakers-crumbs/caddy-access
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
